name: Generate WebP thumbnails

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'product-images/products/**'
      - 'product-images/gifts/**'
      - 'product-images/promotions/**'
      - 'products/**'
      - 'gifts/**'
      - 'promotions/**'
      - 'scripts/generate_webp_thumbnails.py'
      - '.github/workflows/generate-webp-thumbnails.yml'

permissions:
  contents: write

concurrency:
  group: generate-webp-thumbnails
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check Pillow==11.3.0

      - name: Generate thumbnails
        run: python scripts/generate_webp_thumbnails.py

      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all -- '**/thumbs/**/*.webp' webp-thumbnail-manifest.json
          if git diff --cached --quiet; then
            echo "No thumbnail changes."
            exit 0
          fi
          git commit -m "chore: regenerate WebP image thumbnails"
          git push origin HEAD:main
